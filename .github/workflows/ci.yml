name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npx vite build
      - name: Bundle size budget
        run: npm run bundle-size
      - name: Tick benchmark (warn-only)
        run: |
          npm run bench -- --json bench.json
          {
            echo '### Tick benchmark'
            echo
            echo '```json'
            cat bench.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Balance report freshness
        run: |
          npm run balance -- --out balance-fresh.md
          # The header stamps the generating commit, so it always differs; compare the rest.
          # Results depend on CPU architecture, so regenerate with `npm run balance:ci` (linux/amd64).
          if diff -u <(grep -v '^Generated by' docs/balance.md) <(grep -v '^Generated by' balance-fresh.md) > balance.diff; then
            echo 'docs/balance.md matches the code.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error file=docs/balance.md::docs/balance.md is stale; run `npm run balance:ci` and commit the result.'
            {
              echo '### Balance report is stale'
              echo
              echo '```diff'
              cat balance.diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat balance.diff
            exit 1
          fi
